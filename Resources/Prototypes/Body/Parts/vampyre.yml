# TODO BODY: Part damage
- type: entity
  id: Partvampyre
  parent: BaseItem
  name: "vampyre body part"
  abstract: true
  components:
  - type: Damageable
    damageContainer: Biological
  - type: BodyPart
  - type: ContainerContainer
    containers:
      bodypart: !type:Container
        ents: []
  - type: StaticPrice
    price: 20
  - type: Gibbable
  - type: Tag
    tags:
      - Trash

- type: entity
  id: Torsovampyre
  name: "vampyre torso"
  parent: Partvampyre
  components:
    - type: Sprite
      sprite: Mobs/Species/Human/parts.rsi
      state: "torso_m"
    - type: Icon
      sprite: Mobs/Species/Human/parts.rsi
      state: "torso_m"
    - type: BodyPart
      partType: Torso

- type: entity
  id: Headvampyre
  name: "skull"
  description: Alas poor Yorick...
  parent: Partvampyre
  components:
    - type: Sprite
      sprite: Mobs/Species/Human/parts.rsi
      state: "skull_icon"
    - type: Icon
      sprite: Mobs/Species/Human/parts.rsi
      state: "skull_icon"
    - type: BodyPart
      partType: Head
    - type: Input
      context: "human"
    - type: Speech
      speechVerb: vampyre
    - type: vampyreAccent
    - type: Actions
    - type: Vocal
      sounds:
        Male: vampyre
        Female: vampyre
        Unsexed: vampyre
    - type: Emoting
    - type: Grammar
      attributes:
        proper: true
    - type: Examiner
    - type: DoAfter
    - type: MobState
      allowedStates:
        - Alive
    - type: Tag
      tags:
        - MindTransferTarget
        - Head

